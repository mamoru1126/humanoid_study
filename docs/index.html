<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ヒューマノイドの勉強資料</title>
<meta name="description" content="ヒューマノイドと、ロボットに作業を学習させる技術についての勉強資料の一覧。">
<style>
:root{
  --paper:#F2F4F6; --sheet:#FFFFFF; --ink:#18222D; --steel:#56626E; --line:#C9D1D9;
  --panel:#1B232C; --lamp:#F2A900; --sim:#3949AB;
  --sans:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8}
.wrap{max-width:46rem;margin:0 auto;padding:0 20px}
header{background:var(--sheet);border-bottom:1px solid var(--line);padding:40px 0 30px}
h1{font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.4;margin:0 0 .4em;word-break:auto-phrase;text-wrap:balance}
header p{margin:0;color:var(--steel)}
main{padding:30px 0 70px}
ol.docs{list-style:none;margin:0;padding:0}
ol.docs li{background:var(--sheet);border:1px solid var(--line);border-radius:6px;margin:0 0 14px}
ol.docs a{display:block;padding:18px 20px;color:inherit;text-decoration:none}
ol.docs a:hover h2,ol.docs a:focus-visible h2{text-decoration:underline;text-underline-offset:.2em}
ol.docs a:focus-visible{outline:3px solid var(--lamp);outline-offset:2px;border-radius:6px}
ol.docs time{display:inline-block;background:var(--panel);color:var(--lamp);font-size:.8rem;font-weight:700;padding:.1em .6em;border-radius:4px;font-variant-numeric:tabular-nums}
ol.docs h2{font-size:1.15rem;line-height:1.5;margin:.5em 0 .3em;color:var(--sim);word-break:auto-phrase}
ol.docs p{margin:0;font-size:.92rem;line-height:1.7}
footer{font-size:.84rem;color:var(--steel);padding:0 0 30px}
footer a{color:var(--sim)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>ヒューマノイドの勉強資料</h1>
    <p>ヒューマノイドと、ロボットに作業を学習させる技術について、調べたことをまとめる。</p>
  </div>
</header>
<main>
  <div class="wrap">
    <ol class="docs">
      <li>
        <a href="genie-sim/">
          <time datetime="2026-11-14">2026-11-14</time>
          <h2>Genie Sim を RTX 3090 で動かす：仕組み、すごいところ、勉強になるところ</h2>
          <p>AgiBot のロボット学習向けシミュレーション基盤 Genie Sim の構成、方策とのやりとり、採点の仕組み。シミュレーションと実機の成績が合うという報告の中身。RTX 3090 で動かすときの制約と、学べること。</p>
        </a>
      </li>
    </ol>
  </div>
</main>
<footer>
  <div class="wrap">
    <a href="https://github.com/mamoru1126/humanoid_study">mamoru1126/humanoid_study</a>
  </div>
</footer>
</body>
</html>
